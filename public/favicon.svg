<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="etos-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="55%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#17072B"/>
    </linearGradient>
    <linearGradient id="etos-gold" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Sovereign Purple Architectural Crest Shield -->
  <rect width="64" height="64" rx="15" fill="url(#etos-bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="12" stroke="url(#etos-gold)" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Real Estate Gold Sunburst / Crown Apex -->
  <path d="M32 7L35.5 11.5L32 16L28.5 11.5L32 7Z" fill="url(#etos-gold)"/>

  <!-- Twin-Gable Architectural Rooflines (Inspired by Etosmania Crest) -->
  <path d="M10 30L25 17L38 28" stroke="url(#etos-gold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 29L41 18L54 29" stroke="#FAF9FC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Architectural Pillars & Windows -->
  <path d="M15 27.5V47H49V26.5" stroke="#FAF9FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="21" y="31" width="5" height="5" rx="1" fill="url(#etos-gold)"/>
  <rect x="28" y="31" width="5" height="5" rx="1" fill="url(#etos-gold)"/>
  <rect x="37" y="32" width="6" height="9" rx="1" stroke="url(#etos-gold)" stroke-width="1.8"/>

  <!-- Gold Foundation Plinth -->
  <line x1="11" y1="51.5" x2="53" y2="51.5" stroke="url(#etos-gold)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="17" y1="55" x2="47" y2="55" stroke="#FAF9FC" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round"/>
</svg>
