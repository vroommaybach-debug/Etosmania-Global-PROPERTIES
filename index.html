    <script>
      (function () {
        function isExternalExtensionNoise(msg, src, stack) {
          var combined = ((msg || '') + ' ' + (src || '') + ' ' + (stack || '')).toLowerCase();
          return (
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('metamask') !== -1 ||
            combined.indexOf('inpage.js') !== -1 ||
            combined.indexOf('ethereum') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            var msg = event && event.message ? String(event.message) : '';
            var src = event && event.filename ? String(event.filename) : '';
            var stack = event && event.error && event.error.stack ? String(event.error.stack) : '';
            if (isExternalExtensionNoise(msg, src, stack)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = reason && reason.stack ? String(reason.stack) : '';
            if (isExternalExtensionNoise(msg, '', stack)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
