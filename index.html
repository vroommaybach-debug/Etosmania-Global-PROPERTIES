    <script>
      (function () {
        function isExtensionError(msg, source, stack) {
          var combined = ((msg || '') + ' ' + (source || '') + ' ' + (stack || '')).toLowerCase();
          return (
            combined.indexOf('metamask') !== -1 ||
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('safari-web-extension://') !== -1 ||
            combined.indexOf('inpage.js') !== -1 ||
            combined.indexOf('ethereum') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = event && event.message ? String(event.message) : '';
            var filename = event && event.filename ? String(event.filename) : '';
            var stack = event && event.error && event.error.stack ? String(event.error.stack) : '';
            if (isExtensionError(msg, filename, stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event ? event.reason : null;
            var msg = reason && reason.message ? String(reason.message) : String(reason || '');
            var stack = reason && reason.stack ? String(reason.stack) : '';
            if (isExtensionError(msg, '', stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
